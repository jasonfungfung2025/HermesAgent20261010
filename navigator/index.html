<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="JasonGor 的 Web App 專案導覽：卡片式總覽、搜尋與分類篩選。">
<title>專案導覽 Navigator</title>
<style>
:root{
  --bg:#0f1522; --bg-2:#131b2d; --card:#182238; --card-hi:#1d2a45;
  --ink:#eef2f9; --ink-2:#9aa7c0; --ink-3:#5f6f8f;
  --line:#26334f; --line-2:#31415f;
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.14);
  --good:#34d399; --good-soft:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --radius:14px; --shadow:0 2px 6px rgba(4,8,16,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 500px at 50% -10%, #17223a 0%, var(--bg) 60%);
  color:var(--ink);
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:40px 18px 64px}

/* header */
header{margin-bottom:26px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;font-weight:600;margin-bottom:8px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
h1{font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.5px}
.sub{color:var(--ink-2);margin:0;font-size:14.5px}
.sub code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--accent);font-family:ui-monospace,"SF Mono",Consolas,monospace}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 6px}
.search{position:relative;flex:1;min-width:220px}
.search input{
  width:100%;min-height:46px;padding:0 14px 0 42px;
  background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  color:var(--ink);font:inherit;font-size:14.5px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:40px;padding:0 15px;border-radius:999px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink-2);
  font:inherit;font-size:13.5px;font-weight:600;transition:all .15s;
}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .n{color:var(--ink-3);font-weight:500;margin-left:5px}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.statusline{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 14px;color:var(--ink-3);font-size:13px}
.statusline .clr{background:none;border:none;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:7px;min-height:36px}
.statusline .clr:hover{background:var(--card);color:var(--ink)}
.statusline .clr:focus-visible{outline:2px solid var(--accent)}
.statusline .clr[hidden]{display:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);background:var(--card-hi)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h2{font-size:17px;font-weight:700;margin:0;line-height:1.35}
.badge{flex-shrink:0;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.badge.live{background:var(--good-soft);color:var(--good);border:1px solid rgba(52,211,153,.35)}
.badge.dev{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(251,191,36,.35)}
.desc{color:var(--ink-2);font-size:13.5px;margin:0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
  background:rgba(148,163,199,.1);border:1px solid var(--line);color:var(--ink-2);
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.cat{font-size:12px;color:var(--ink-3);font-weight:600}
.linkbtn{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:13px;font-weight:700;color:var(--accent);
  padding:7px 12px;border-radius:8px;min-height:38px;
  transition:background .15s;
}
.linkbtn:hover{background:var(--accent-soft)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.linkbtn.soon{color:var(--ink-3);cursor:default}
.linkbtn.soon:hover{background:none}

/* empty + error */
.empty,.err{text-align:center;padding:56px 16px;color:var(--ink-3)}
.empty h3{color:var(--ink-2);font-size:17px;margin:0 0 6px}
.empty p{margin:0;font-size:13.5px}
.err{border:1px solid rgba(251,191,36,.3);background:var(--warn-soft);border-radius:var(--radius);padding:24px}
.err h3{margin:0 0 6px;color:var(--warn);font-size:16px}
.err p{margin:0 0 4px;font-size:13.5px;color:var(--ink-2)}
.err code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--warn)}

@media print{
  body{background:#fff}
  :root{--bg:#fff;--card:#fff;--ink:#111;--ink-2:#444;--ink-3:#777;--line:#ccc;--line-2:#999;--accent:#1d4ed8}
  .controls,.statusline .clr{display:none!important}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>Web App 專案導覽</div>
    <h1>Navigator</h1>
    <p class="sub">所有 Web 專案一覽。新增專案只需修改 <code>projects.json</code>，頁面會自動載入、分類與篩選。</p>
  </header>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <input type="search" id="q" placeholder="搜尋專案名稱、簡介或技術…" aria-label="搜尋專案" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="按分類篩選"></div>
  </div>

  <div class="statusline">
    <span id="count" aria-live="polite"></span>
    <button class="clr" id="clear" type="button">清除篩選</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h3>沒有符合條件的專案</h3>
    <p>试试其他關鍵字，或清除篩選重新瀏覽全部專案。</p>
  </div>
  <div class="err" id="err" hidden>
    <h3>無法載入 projects.json</h3>
    <p>請以 HTTP 開啟本頁（例如部署到 GitHub Pages 後），或在本目錄啟動本地伺服器：<br><code>python3 -m http.server</code>（直接以 file:// 開啟時瀏覽器會阻擋 JSON 載入）。</p>
  </div>

  <p class="empty" style="padding:36px 0 0;font-size:12px" id="meta"></p>
</div>

<script>
"use strict";
var DATA=null;
var cat="all";
var q="";

var STATUS={live:{label:"已上線",cls:"live"},dev:{label:"開發中",cls:"dev"}};
var ARM=STATUS; /* alias kept for readability */

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function visible(){
  if(!DATA) return [];
  return DATA.projects.filter(function(p){
    if(cat!=="all" && p.category!==cat) return false;
    if(q){
      var hay=(p.name+" "+(p.desc||"")+" "+(p.stack||[]).join(" ")+" "+(p.url||"")).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}

function renderChips(){
  var counts={};
  DATA.projects.forEach(function(p){counts[p.category]=(counts[p.category]||0)+1;});
  var cats=["all"].concat(Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}));
  var wrap=$("chips");wrap.innerHTML="";
  cats.forEach(function(c){
    var b=document.createElement("button");
    b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",String(c===cat));
    if(c==="all"){
      b.innerHTML="全部<span class=\"n\">"+DATA.projects.length+"</span>";
    }else{
      b.innerHTML=esc(c)+"<span class=\"n\">"+counts[c]+"</span>";
    }
    b.addEventListener("click",function(){cat=c;renderAll();});
    wrap.appendChild(b);
  });
}

function renderCards(){
  var rows=visible(),grid=$("grid");
  grid.innerHTML="";
  rows.forEach(function(p){
    var st=STATUS[p.status]||{label:p.status||"—",cls:"dev"};
    var card=document.createElement("article");
    card.className="card";
    var link="";
    if(p.url){
      link='<a class="linkbtn" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">開啟專案'+
        '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9L9 3M9 3H5M9 3V7"/></svg></a>';
    }else{
      link='<span class="linkbtn soon" title="尚未上線">即將上線</span>';
    }
    card.innerHTML=
      '<div class="card-top"><h2>'+esc(p.name)+'</h2><span class="badge '+st.cls+'">'+esc(st.label)+'</span></div>'+
      '<p class="desc">'+esc(p.desc)+'</p>'+
      '<div class="tags">'+(p.stack||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>'+
      '<div class="card-foot"><span class="cat">'+esc(p.category||"未分類")+'</span>'+link+'</div>';
    grid.appendChild(card);
  });
  $("empty").hidden=rows.length>0;
  var active=q||cat!=="all";
  $("clear").hidden=!active;
  $("count").textContent=active?("符合條件 "+rows.length+" 個專案"):("共 "+DATA.projects.length+" 個專案");
}

function renderAll(){renderChips();renderCards();}

$("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();renderCards();});
$("clear").addEventListener("click",function(){
  q="";cat="all";$("q").value="";renderAll();$("q").focus();
});

fetch("projects.json",{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(d){
  DATA=d;
  $("meta").textContent="最後更新："+(d.updated||"未知")+"｜來源：projects.json";
  renderAll();
}).catch(function(e){
  $("err").hidden=false;
  $("grid").innerHTML="";
  console.error("projects.json load failed:",e);
});
</script>
</body>
</html>
