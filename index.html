<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f5f2;
    --card: #ffffff;
    --ink: #1a1d1f;
    --ink-soft: #5b6166;
    --ink-faint: #9aa1a8;
    --line: #e5e3de;
    --accent: #15803d;
    --accent-soft: #e3f2e8;
    --danger: #c2410c;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20, 24, 28, 0.06), 0 8px 24px rgba(20, 24, 28, 0.07);
  }
  [data-theme="dark"] {
    --paper: #101214;
    --card: #1a1d20;
    --ink: #f2f3f1;
    --ink-soft: #a3a9ad;
    --ink-faint: #6d747a;
    --line: #2a2e33;
    --accent: #4ade80;
    --accent-soft: #17321f;
    --danger: #fb923c;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 48px 16px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .app {
    width: 100%;
    max-width: 520px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .count {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .count strong { color: var(--ink); font-weight: 700; }

  /* Add bar */
  .add-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .add-bar input {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    padding: 0 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .add-bar input::placeholder { color: var(--ink-faint); font-weight: 500; }
  .add-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .add-bar button {
    min-width: 48px;
    min-height: 48px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  [data-theme="dark"] .add-bar button { color: #10240f; }
  .add-bar button:hover { filter: brightness(1.08); }
  .add-bar button:active { transform: scale(0.97); }
  .add-bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Filters */
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filters button {
    min-height: 36px;
    padding: 0 14px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filters button:hover { background: var(--card); color: var(--ink); }
  .filters button[aria-pressed="true"] {
    background: var(--card);
    color: var(--ink);
    border-color: var(--line);
  }
  .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* List */
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 8px 6px 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: enter 0.18s ease;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(-4px); }
  }
  li.item.removing {
    opacity: 0;
    transform: translateX(12px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  /* Custom checkbox */
  .check {
    position: relative;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 10px;
  }
  .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check .box {
    width: 24px;
    height: 24px;
    border: 2px solid var(--ink-faint);
    border-radius: 8px;
    display: grid;
    place-items: center;
    transition: all 0.15s ease;
  }
  .check .box svg {
    width: 14px;
    height: 14px;
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  li.done .check .box {
    background: var(--accent);
    border-color: var(--accent);
  }
  li.done .check .box svg { opacity: 1; transform: scale(1); }

  .label {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
    overflow-wrap: anywhere;
    transition: color 0.2s ease;
  }
  li.done .label {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }

  .del {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .del:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }
  .del svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }

  /* Empty state */
  .empty {
    display: none;
    padding: 44px 16px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 15px;
    font-weight: 500;
  }
  .empty.show { display: block; }

  /* Footer */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    min-height: 40px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  footer button {
    font: inherit;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    min-height: 40px;
    padding: 0 8px;
    border-radius: 8px;
    cursor: pointer;
  }
  footer button:hover { color: var(--danger); }
  footer button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer button:disabled { opacity: 0.4; cursor: default; }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle svg { width: 18px; height: 18px; fill: currentColor; }
  [data-theme="dark"] .theme-toggle .sun { display: none; }
  .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>

  <main class="app" aria-label="Task list">
    <header>
      <h1>Tasks</h1>
      <span class="count" id="count" aria-live="polite"></span>
    </header>

    <div class="add-bar">
      <input type="text" id="newTask" placeholder="Add a new task…"
             aria-label="New task" maxlength="200" autocomplete="off">
      <button id="addBtn" aria-label="Add task">Add</button>
    </div>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="active" aria-pressed="false">Active</button>
      <button data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list"></ul>

    <div class="empty" id="empty" aria-live="polite"></div>

    <footer>
      <span id="remaining"></span>
      <button id="clearDone" disabled>Clear completed</button>
    </footer>
  </main>

<script>
(function () {
  "use strict";
  var STORE = "tasks.v1";
  var tasks = load();
  var filter = "all";

  var list = document.getElementById("list");
  var input = document.getElementById("newTask");
  var addBtn = document.getElementById("addBtn");
  var empty = document.getElementById("empty");
  var countEl = document.getElementById("count");
  var remainingEl = document.getElementById("remaining");
  var clearBtn = document.getElementById("clearDone");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filters button"));

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE)) || []; }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem(STORE, JSON.stringify(tasks)); }

  function addTask(text) {
    text = text.trim();
    if (!text) return;
    tasks.push({ id: Date.now() + Math.random().toString(36).slice(2, 6), text: text, done: false });
    input.value = "";
    input.focus();
    save();
    render();
  }

  function toggleTask(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (t) t.done = !t.done;
    save();
    render();
  }

  function removeTask(id) {
    var li = list.querySelector('[data-id="' + id + '"]');
    tasks = tasks.filter(function (x) { return x.id !== id; });
    save();
    if (li) {
      li.classList.add("removing");
      setTimeout(function () { render(); }, 180);
    } else {
      render();
    }
  }

  function clearDone() {
    var doneIds = tasks.filter(function (t) { return t.done; }).map(function (t) { return t.id; });
    doneIds.forEach(removeTask);
    if (filter === "done") filter = "all";
    syncFilterUI();
  }

  function syncFilterUI() {
    filterBtns.forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.filter === filter ? "true" : "false");
    });
  }

  function render() {
    var visible = tasks.filter(function (t) {
      return filter === "all" || (filter === "active" ? !t.done : t.done);
    });

    list.innerHTML = "";
    visible.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "item" + (t.done ? " done" : "");
      li.dataset.id = t.id;

      var check = document.createElement("button");
      check.className = "check";
      check.setAttribute("role", "checkbox");
      check.setAttribute("aria-checked", t.done ? "true" : "false");
      check.setAttribute("aria-label", (t.done ? "Mark as not done: " : "Mark as done: ") + t.text);
      check.innerHTML = '<span class="box"><svg viewBox="0 0 16 16"><polyline points="3,8.5 6.5,12 13,4.5"/></svg></span>';
      check.addEventListener("click", function () { toggleTask(t.id); });

      var label = document.createElement("span");
      label.className = "label";
      label.textContent = t.text;

      var del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "Delete: " + t.text);
      del.innerHTML = '<svg viewBox="0 0 20 20"><path d="M4 6h12M9 6V4h2v2M6.5 6l.8 10.2a1 1 0 001 .8h3.4a1 1 0 001-.8L13.5 6"/></svg>';
      del.addEventListener("click", function () { removeTask(t.id); });

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });

    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.done; }).length;
    var active = total - done;

    countEl.innerHTML = total === 0 ? "" : "<strong>" + total + "</strong> " + (total === 1 ? "task" : "tasks");
    remainingEl.textContent = total === 0 ? "" : active + " " + (active === 1 ? "task" : "tasks") + " remaining";
    clearBtn.disabled = done === 0;

    var showEmpty = visible.length === 0;
    empty.classList.toggle("show", showEmpty);
    if (showEmpty) {
      empty.textContent = total === 0 ? "Nothing here yet. Add your first task above."
                                       : "No " + (filter === "active" ? "active" : "completed") + " tasks.";
    }
  }

  addBtn.addEventListener("click", function () { addTask(input.value); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask(input.value);
  });
  clearBtn.addEventListener("click", clearDone);
  filterBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.filter;
      syncFilterUI();
      render();
    });
  });

  // Theme: persist choice; default follows system
  var themeBtn = document.getElementById("themeToggle");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("theme.v1"); } catch (e) {}
  if (savedTheme) {
    applyTheme(savedTheme);
  } else {
    applyTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("theme.v1", next); } catch (e) {}
  });

  render();
})();
</script>
</body>
</html>
